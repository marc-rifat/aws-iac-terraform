server:
  port: 8080

spring:
  application:
    name: iac-test-backend

aws:
  region: us-east-1
  lambda:
    function-name: iac-test-lambda

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.example.iactest: INFO
    com.amazonaws: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"